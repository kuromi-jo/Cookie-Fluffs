<!-- @file password-requirements.component.html @description Accessible live password-policy checklist. -->
<section class="password-guide" aria-label="Password requirements" aria-live="polite">
  <h2>Password requirements</h2>
  <ul>
    @for (requirement of requirements(); track requirement.label) {
      <li [class.done]="requirement.met" [class.advisory]="requirement.advisory">
        <ion-icon
          [name]="requirement.met ? 'checkmark-circle' : (requirement.advisory ? 'information-circle-outline' : 'ellipse-outline')"
          aria-hidden="true"
        ></ion-icon>
        {{ requirement.label }}
      </li>
    }
  </ul>
  <p>A few unrelated words make a strong password.</p>
</section>
