<ion-header class="cf-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false" aria-label="Open menu"></ion-menu-button>
    </ion-buttons>
    <ion-title class="cf-title">Contact Us</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="cf-page">
    <section class="cf-hero-band hero cf-rise">
      <span class="cf-eyebrow light">Help and support</span>
      <h1>Send Cookie Fluffs a message</h1>
      <p>Share a question, an order concern, or feedback through this form.</p>
      <img class="hero-art" src="assets/brand/cookie-logo.svg" alt="" />
    </section>

    <h2 class="cf-section-title">Send us a message</h2>
    <form #f="ngForm" (ngSubmit)="send(f)" novalidate class="cf-card form">
      @if (sent()) {
        <p class="sent"><ion-icon name="checkmark-circle"></ion-icon>Your message was saved.</p>
      }
      <ion-input class="cf-input" label="Your name" labelPlacement="floating" name="name" [(ngModel)]="name" required minlength="2"></ion-input>
      <ion-input class="cf-input" type="email" label="Email" labelPlacement="floating" name="email" [(ngModel)]="email" required email></ion-input>
      <ion-select class="cf-input" label="Topic" labelPlacement="floating" name="subject" [(ngModel)]="subject" interface="action-sheet">
        @for (s of subjects; track s) {
          <ion-select-option [value]="s">{{ s }}</ion-select-option>
        }
      </ion-select>
      <ion-textarea
        class="cf-input"
        label="Message"
        labelPlacement="floating"
        name="message"
        [(ngModel)]="message"
        [autoGrow]="true"
        rows="4"
        required
        minlength="5"
        maxlength="2000"
        [counter]="true"
      ></ion-textarea>
      <ion-button type="submit" expand="block" class="cf-btn-lg" [disabled]="sending()">
        @if (sending()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <ion-icon slot="start" name="send-outline"></ion-icon>
          Send message
        }
      </ion-button>
    </form>
  </div>
</ion-content>
